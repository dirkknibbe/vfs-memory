name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip:
    # - Fork PRs. GitHub strips secrets from fork-PR contexts via the
    #   `pull_request` event, but the explicit gate is intent-visible.
    # - Bot PRs (Dependabot, Renovate, etc.). They open from same-repo
    #   branches, so the fork gate doesn't catch them. The action's
    #   built-in non-human-actor refusal would catch them downstream, but
    #   only after spinning up a runner and installing the JS deps. And
    #   on Dependabot-triggered runs GitHub injects Dependabot secrets
    #   rather than Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN isn't
    #   available anyway.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
